# The five classification tasks (Table 1). Class names must match the `class`
# column of the recording manifest (see README, "Data").

tasks:
  wtsp_feebee:
    title: WTSP/fee-bee song
    classes: [WTSP, BCCH/fee-bee]
  bcch_variants:
    title: BCCH vocalization variants
    classes: [BCCH/chick-a-dee, BCCH/tseet, BCCH/fee-bee]
  four_species:
    title: Four species
    classes: [TEWA, WTSP, BCCH/fee-bee, YWAR]
  species_bcch_variants:
    title: Species + BCCH variants
    classes: [BCCH/chick-a-dee, BCCH/tseet, BCCH/fee-bee, TEWA, WTSP, YWAR]
  yeca_dialects:
    title: YECA four dialects
    classes: [YECA/Co, YECA/U, YECA/RN, YECA/SL]
